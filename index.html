<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Um pequeno exemplo</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <li><a href="#Home">Home</a></li>
            <li><a href="#Serviço">Serviço</a></li>
            <li><a href="#sbore">Sobre</a></li>
        </nav>
    </header>
    <main>
        <section class="content">
            <h2>
                Bem-Vindo
            </h2>
            <form action="#">
                <div class="email">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="Digite o seu email">
                </div>
                <div class="senha">
                    <label for="senha">Senha</label>
                    <input type="password" name="senha" id="senha" placeholder="Digite a sua password">
                </div>
                <input type="submit" value="Enviar" class="btn">
                
                </div>
            </form>
        </section>
    </main>
</body>
</html>
